# Anchor local stack: Postgres with pgvector, the app, and an optional pgAdmin.
# Compose runs no migrations, and the app image cannot run the seed (it has no
# src/), so do both from the repo on your machine, with DATABASE_URL pointing at
# localhost:5432 (see DEPLOY.md):
#   docker compose up -d postgres
#   npx prisma migrate deploy
#   npm run seed
#   docker compose up -d app            # then open http://localhost:3000

services:

  # --- Postgres + pgvector ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: anchor-postgres
    environment:
      # Local throwaway defaults — override via .env for any shared/remote use.
      POSTGRES_USER: "${POSTGRES_USER:-anchor}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-anchor}"
      POSTGRES_DB: "${POSTGRES_DB:-anchor}"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./prisma/init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anchor -d anchor"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # --- Anchor app (Next.js standalone) ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anchor-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-anchor}:${POSTGRES_PASSWORD:-anchor}@postgres:5432/${POSTGRES_DB:-anchor}?sslmode=disable"
      DIRECT_URL:   "postgresql://${POSTGRES_USER:-anchor}:${POSTGRES_PASSWORD:-anchor}@postgres:5432/${POSTGRES_DB:-anchor}?sslmode=disable"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      NEXT_PUBLIC_DEMO_MODE: "true"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # --- Optional: pgAdmin for local introspection ---
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: anchor-pgadmin
    profiles: ["debug"]                  # only starts with: docker compose --profile debug up
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL:-admin@example.com}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD:-anchor}"
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
