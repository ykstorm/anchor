name: Benchmark

# Retrieval-latency benchmark. Runs on a pgvector service container (stable
# Docker on the runner) and measures the HNSW cosine search at 1k / 10k / 100k
# vectors. No API key, no cost — random vectors, pure DB-side latency.
on:
  push:
    branches: [main]
    paths: ['bench/**', 'src/lib/rag/**', '.github/workflows/benchmark.yml']
  pull_request:
    paths: ['bench/**', 'src/lib/rag/**']
  workflow_dispatch:

jobs:
  retrieval-latency:
    runs-on: ubuntu-latest
    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: anchor
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - name: Run retrieval-latency-at-scale benchmark
        run: node bench/latency-scale.mjs | tee bench/results.txt
      - uses: actions/upload-artifact@v7
        with:
          name: retrieval-latency
          path: bench/results.txt
